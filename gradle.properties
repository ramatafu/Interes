# Явно указываем Gradle, на какой JDK запускаться. Без этого Gradle иногда
# подхватывает урезанный JBR из Android Studio (там нет jpackage.exe — им
# упаковывается .msi/.exe, см. задачу :desktopApp:checkRuntime) вместо
# полноценного JDK. Путь конкретно под эту машину (Valuka) — если
# переносишь проект на другой компьютер, поправь на свой путь к JDK 17+
# с jpackage (узнать все варианты: `where.exe jpackage` в PowerShell).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.8-hotspot
